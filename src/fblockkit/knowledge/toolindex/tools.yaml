# fBlockKit external tool index (T1: the A/B/C tiers)
# Two dimensions must be recorded separately, otherwise "registered" is read as "used":
#   relation (strategy): absorb = tier A (we take in its file format/algorithm);
#                        interface = tier B (we interface: generate its input, read its output);
#                        index = tier C (registered only; a compute-kernel type, possibly
#                        with an algorithm borrowed from it)
#   status (present state): active = actually used in this version (protocol internalised or
#                           already interfaced); planned = registered only, not used yet
# The license field follows the official repository; where this group's documents do not state
# it, it is marked "to be checked" rather than guessed.
# Convention: note and evidence.text always use the block scalar (>-).

- id: mokit
  name: MOKIT / automr
  purpose: black-box multireference workflow (UNO/GVB route, automatic active-space selection; hands orbitals between 19 programs)
  relation: interface
  status: active
  license: Apache-2.0
  source: https://gitlab.com/jxzou/mokit
  note: >-
    Interfaced as of 2026-09-30: menu 44 writes the .gjf + mokit{} input and menu
    45 reads the automr output back. Verified end-to-end by running the generated input
    through a deployed MOKIT 1.2.8 (official prebuilt package; GVB on a Gaussian 16 backend
    because GAMESS is absent here, CASSCF on its PySCF default) to Normal termination. The
    official citation form is "Jingxiang Zou, Molecular Orbital Kit (MOKIT)". Not fully
    functional on Windows.
  evidence:
    - {kind: measured, text: Research synthesis §1 (tools and worked examples) and §5 (direct-wrapping list), ref: 调研/合成_cjq12_全景与方案_20260925.md}
    - {kind: measured, text: Deployment and acceptance runs (2026-09-30; H2O probes with GVB_prog=Gaussian, CASSCF(4e,4o) automatically determined, Normal termination; one measured boundary: Gaussian 16 crashed on an automatically chosen GVB(5) for N2 on this machine)., ref: fixtures/mokit/README.md}
    - {kind: manual, text: GVB_prog accepts GAMESS (default), Gaussian and QChem only; PySCF is not a GVB backend., ref: MOKIT manual section 4.4.10, url: https://doc.mokit.xyz/chap4-4.html}

- id: autocas
  name: autoCAS
  purpose: entropy-based automatic active-space selection (single-orbital entropy + mutual-information protocol)
  relation: index
  status: active
  license: BSD-3-Clause
  source: pip package scine-autocas (v3.0.0)
  note: >-
    Only the protocol is internalised (thresholds 0.14 / 1–2% fallback, and the
    localized-basis precondition); the software is not integrated. Assessment of
    2026-09-30: the program itself cannot run in this environment -- its PySCF interface
    requires a DMRG solver, the Block2 branch is a NotImplementedError placeholder in
    release 3.0.0, and the QCMaquis wrapper (scine-qcmaquis) has no PyPI distribution
    while the conda channel does not answer here.
  evidence:
    - {kind: measured, text: BSD-3 license, pip package name scine-autocas (v3.0.0), ref: the AutoCAS methodology record (2026-09-21)}
    - {kind: measured, text: Run-attempt record (2026-09-30) -- the HF stage converged, the initial CAS(10,8) of N2 was printed, then the missing QCMaquis backend raised NameError inside _setup_qcmaquis; the reachability checks above are recorded in the reconnaissance record of 2026-09-30., ref: run-attempt record (2026-09-30)}

