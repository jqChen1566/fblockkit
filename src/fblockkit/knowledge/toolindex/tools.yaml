- id: multiwfn
  name: Multiwfn
  purpose: general wavefunction analysis and visualization (isosurfaces, 2D maps, spectra, topology) -- the recommended destination for pictures made from this toolkit's exports
  relation: index
  status: planned
  license: free of charge, closed source (see the program's own terms)
  source: http://sobereva.com/multiwfn
  note: >-
    Not interfaced and not bundled: the division of labour keeps pictures with the
    user's own styling. The program reads the engine's own formats that this toolkit
    writes and hands over -- the gbw-ready mkl of the write-back menus (after
    orca_2mkl -gbw), the AILFT LFT gbw named in the menu-38 report, and the integral
    dumps -- so orbital, density and spectrum figures can be made there without any
    conversion by this toolkit. Menus that end in a curve (relaxation, spectra,
    magnetocaloric, Judd-Ofelt) additionally write a plot-ready CSV beside the report.
  evidence:
    - {kind: literature, text: The program's classic paper., ref: "Lu T., Chen F., J. Comput. Chem., 2012, 33 (5), 580-592, DOI 10.1002/jcc.22885", bibkey: lu2012multiwfn}
    - {kind: literature, text: The 2024 comprehensive overview of the program., ref: "Lu T., J. Chem. Phys., 2024, 161, 082503, DOI 10.1063/5.0216272", bibkey: lu2024multiwfn}

